<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Axiom Mario 120 FPS — Destructible Pixel Art & Dynamic Lighting</title>
<style>
  * { box-sizing: border-box; user-select: none; }
  body {
    margin: 0;
    background: #06080e;
    color: #f1f5f9;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
  }
  #game-container {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(99, 102, 241, 0.2);
    border: 2px solid rgba(255, 255, 255, 0.1);
  }
  canvas {
    display: block;
    background: #5c94fc;
    image-rendering: pixelated;
  }
  #ui-overlay {
    position: absolute;
    top: 16px;
    left: 20px;
    right: 20px;
    display: flex;
    justify-content: space-between;
    font-weight: 800;
    font-size: 16px;
    text-shadow: 2px 2px 0px #000;
    letter-spacing: 1px;
    pointer-events: none;
  }
  .hud-badge {
    background: rgba(15, 23, 42, 0.65);
    backdrop-filter: blur(12px);
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
  #controls-hint {
    margin-top: 12px;
    font-size: 13px;
    color: #94a3b8;
    display: flex;
    gap: 20px;
  }
  .key {
    background: #1e293b;
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid #475569;
    color: #38bdf8;
  }
</style>
</head>
<body>

<div id="game-container">
  <div id="ui-overlay">
    <div class="hud-badge">MARIO <span id="score" style="color: #facc15;">001250</span></div>
    <div class="hud-badge">COINS <span id="coins" style="color: #facc15;">× 14</span></div>
    <div class="hud-badge">WORLD <span id="world" style="color: #38bdf8;">1-1 (Overworld)</span></div>
    <div class="hud-badge">FPS <span id="fps" style="color: #4ade80;">120.0</span></div>
  </div>
  <canvas id="gameCanvas" width="960" height="540"></canvas>
</div>

<div id="controls-hint">
  <div><span class="key">A</span> / <span class="key">D</span> или <span class="key">←</span> / <span class="key">→</span> : Движение</div>
  <div><span class="key">W</span> / <span class="key">SPACE</span> : Прыжок (Разрушение блоков)</div>
  <div><span class="key">1</span> - <span class="key">4</span> : Переключение миров (1-1 .. 1-4)</div>
  <div><span class="key">L</span> : Переключение динамического освещения</div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let score = 1250, coins = 14, currentWorld = "1-1";
let enableLighting = true;

// Player Mario State
const mario = {
  x: 80,
  y: 380,
  w: 24,
  h: 36,
  vx: 0,
  vy: 0,
  speed: 4.5,
  jumpPower: -13.5,
  grounded: false,
  facingRight: true
};

// Particles (Destructible Bricks)
let particles = [];

// Level Elements (World 1-1)
let blocks = [
  // Ground
  { x: 0, y: 460, w: 960, h: 80, type: 'ground' },
  // Pipes
  { x: 300, y: 380, w: 48, h: 80, type: 'pipe' },
  { x: 620, y: 340, w: 48, h: 120, type: 'pipe' },
  // Bricks & Question Blocks
  { x: 180, y: 300, w: 32, h: 32, type: 'brick', hit: false },
  { x: 212, y: 300, w: 32, h: 32, type: 'question', hit: false },
  { x: 244, y: 300, w: 32, h: 32, type: 'brick', hit: false },
  { x: 276, y: 300, w: 32, h: 32, type: 'question', hit: false },
  { x: 308, y: 300, w: 32, h: 32, type: 'brick', hit: false },
  
  // Upper Brick Layer
  { x: 420, y: 220, w: 32, h: 32, type: 'brick', hit: false },
  { x: 452, y: 220, w: 32, h: 32, type: 'brick', hit: false },
  { x: 484, y: 220, w: 32, h: 32, type: 'question', hit: false },
  { x: 516, y: 220, w: 32, h: 32, type: 'brick', hit: false }
];

// Lighting Source (Sun / Torch)
const lightSource = { x: 480, y: 70, radius: 450, color: 'rgba(255, 235, 180, 0.18)' };

const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.key === 'l' || e.key === 'L') enableLighting = !enableLighting;
  if (e.key === '1') setWorld("1-1 (Overworld)", "#5c94fc");
  if (e.key === '2') setWorld("1-2 (Underground)", "#020617");
  if (e.key === '3') setWorld("1-3 (Athletic)", "#38bdf8");
  if (e.key === '4') setWorld("1-4 (Bowser Castle)", "#450a0a");
});
window.addEventListener('keyup', e => keys[e.code] = false);

function setWorld(name, bg) {
  currentWorld = name;
  canvas.style.background = bg;
  document.getElementById('world').innerText = name;
}

function shatterBrick(b) {
  for (let i = 0; i < 6; i++) {
    particles.push({
      x: b.x + 16,
      y: b.y + 16,
      vx: (Math.random() - 0.5) * 8,
      vy: -Math.random() * 8 - 3,
      size: Math.random() * 6 + 4,
      color: '#b45309',
      rot: Math.random() * Math.PI,
      rotSpeed: (Math.random() - 0.5) * 0.3
    });
  }
}

function updatePhysics() {
  // Input
  if (keys['ArrowRight'] || keys['KeyD']) {
    mario.vx = mario.speed;
    mario.facingRight = true;
  } else if (keys['ArrowLeft'] || keys['KeyA']) {
    mario.vx = -mario.speed;
    mario.facingRight = false;
  } else {
    mario.vx *= 0.75;
  }

  if ((keys['Space'] || keys['ArrowUp'] || keys['KeyW']) && mario.grounded) {
    mario.vy = mario.jumpPower;
    mario.grounded = false;
  }

  // Gravity
  mario.vy += 0.65;
  mario.x += mario.vx;
  mario.y += mario.vy;

  // Collision with screen borders
  if (mario.x < 0) mario.x = 0;
  if (mario.x > canvas.width - mario.w) mario.x = canvas.width - mario.w;

  mario.grounded = false;

  // Block Collisions
  for (let i = blocks.length - 1; i >= 0; i--) {
    let b = blocks[i];
    if (mario.x + mario.w > b.x && mario.x < b.x + b.w &&
        mario.y + mario.h > b.y && mario.y < b.y + b.h) {
      
      // Bottom Landing
      if (mario.vy > 0 && mario.y + mario.h - mario.vy <= b.y + 10) {
        mario.y = b.y - mario.h;
        mario.vy = 0;
        mario.grounded = true;
      }
      // Top Head-hit (Destruction)
      else if (mario.vy < 0 && mario.y - mario.vy >= b.y + b.h - 10) {
        mario.y = b.y + b.h;
        mario.vy = 2; // bounce down
        if (b.type === 'brick') {
          shatterBrick(b);
          blocks.splice(i, 1);
          score += 50;
          document.getElementById('score').innerText = String(score).padStart(6, '0');
        } else if (b.type === 'question') {
          b.type = 'empty_block';
          score += 200;
          coins += 1;
          document.getElementById('score').innerText = String(score).padStart(6, '0');
          document.getElementById('coins').innerText = `× ${coins}`;
        }
      }
      // Side collisions
      else if (mario.vx > 0) {
        mario.x = b.x - mario.w;
      } else if (mario.vx < 0) {
        mario.x = b.x + b.w;
      }
    }
  }

  // Particles physics
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.vy += 0.5;
    p.x += p.vx;
    p.y += p.vy;
    p.rot += p.rotSpeed;
    if (p.y > canvas.height) {
      particles.splice(i, 1);
    }
  }
}

function renderScene() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Background Scenery (Clouds & Bushes)
  drawScenery();

  // Draw Dynamic Soft Shadows
  if (enableLighting) {
    drawShadows();
  }

  // Draw Blocks
  for (let b of blocks) {
    if (b.type === 'ground') {
      ctx.fillStyle = '#b45309';
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.fillStyle = '#22c55e';
      ctx.fillRect(b.x, b.y, b.w, 14);
    } else if (b.type === 'pipe') {
      ctx.fillStyle = '#16a34a';
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.fillStyle = '#22c55e';
      ctx.fillRect(b.x - 4, b.y, b.w + 8, 16);
      ctx.strokeStyle = '#052e16';
      ctx.lineWidth = 2;
      ctx.strokeRect(b.x, b.y, b.w, b.h);
      ctx.strokeRect(b.x - 4, b.y, b.w + 8, 16);
    } else if (b.type === 'brick') {
      ctx.fillStyle = '#ea580c';
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.strokeStyle = '#7c2d12';
      ctx.strokeRect(b.x, b.y, b.w, b.h);
    } else if (b.type === 'question') {
      ctx.fillStyle = '#eab308';
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.strokeStyle = '#854d0e';
      ctx.strokeRect(b.x, b.y, b.w, b.h);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 18px monospace';
      ctx.fillText('?', b.x + 10, b.y + 22);
    } else if (b.type === 'empty_block') {
      ctx.fillStyle = '#78716c';
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.strokeStyle = '#292524';
      ctx.strokeRect(b.x, b.y, b.w, b.h);
    }
  }

  // Draw Particles (Shattered Bricks)
  for (let p of particles) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
    ctx.restore();
  }

  // Draw Mario (Pixel-Art Sprite)
  drawMario();

  // Realistic Volumetric Lighting & Radial Ambient Occlusion
  if (enableLighting) {
    drawLightingOverlay();
  }
}

function drawScenery() {
  ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
  // Cloud 1
  ctx.beginPath();
  ctx.arc(160, 100, 24, 0, Math.PI * 2);
  ctx.arc(190, 90, 32, 0, Math.PI * 2);
  ctx.arc(220, 100, 24, 0, Math.PI * 2);
  ctx.fill();

  // Cloud 2
  ctx.beginPath();
  ctx.arc(720, 80, 24, 0, Math.PI * 2);
  ctx.arc(750, 70, 32, 0, Math.PI * 2);
  ctx.arc(780, 80, 24, 0, Math.PI * 2);
  ctx.fill();
}

function drawMario() {
  ctx.save();
  ctx.translate(mario.x + (mario.facingRight ? 0 : mario.w), mario.y);
  if (!mario.facingRight) ctx.scale(-1, 1);

  // Cap & Shirt (Red)
  ctx.fillStyle = '#ef4444';
  ctx.fillRect(2, 0, 18, 8);
  ctx.fillRect(4, 8, 14, 12);
  // Overall (Blue)
  ctx.fillStyle = '#2563eb';
  ctx.fillRect(2, 20, 18, 12);
  // Shoes (Brown)
  ctx.fillStyle = '#78350f';
  ctx.fillRect(0, 32, 8, 4);
  ctx.fillRect(14, 32, 8, 4);
  // Face & Hands (Skin tone)
  ctx.fillStyle = '#fed7aa';
  ctx.fillRect(6, 8, 10, 8);
  ctx.fillRect(18, 18, 6, 6);

  ctx.restore();
}

function drawShadows() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
  // Mario shadow on ground
  if (mario.grounded) {
    ctx.beginPath();
    ctx.ellipse(mario.x + mario.w/2, mario.y + mario.h + 2, 16, 4, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawLightingOverlay() {
  const grad = ctx.createRadialGradient(
    lightSource.x, lightSource.y, 40,
    lightSource.x, lightSource.y, lightSource.radius
  );
  grad.addColorStop(0, 'rgba(255, 255, 230, 0.25)');
  grad.addColorStop(0.5, 'rgba(255, 200, 100, 0.08)');
  grad.addColorStop(1, 'rgba(0, 0, 0, 0.35)');

  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

// 120 FPS High-Precision Game Loop
let lastTime = performance.now();
let frames = 0, lastFpsUpdate = performance.now();

function gameLoop(now) {
  updatePhysics();
  renderScene();

  frames++;
  if (now - lastFpsUpdate >= 500) {
    document.getElementById('fps').innerText = ((frames * 1000) / (now - lastFpsUpdate)).toFixed(1);
    frames = 0;
    lastFpsUpdate = now;
  }

  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
